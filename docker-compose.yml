version: '3.8'

services:
  db:
    image: mysql:8
    container_name: mysql-permisos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: permisos123
      MYSQL_DATABASE: permisos_ambientales
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppermisos123"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: login-service
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=permisos123
      - DB_NAME=permisos_ambientales
      - UPLOADS_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data: