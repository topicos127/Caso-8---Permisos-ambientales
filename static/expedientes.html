<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis expedientes — Permisos Ambientales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<script src="js/interaccion.js"></script>
<style>
  /* Sprint 8: la vista del director de proyectos tiene 9 columnas; menos relleno para que quepan. */
  .ledger.compacta th, .ledger.compacta td { padding-right: 10px; }
  .ledger.compacta .status { font-size: 12px; padding: 3px 8px 3px 6px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="rail-brand">
      <div class="seal">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.1">
          <circle cx="20" cy="20" r="17"/>
          <path d="M6 24c4-4 8 4 12 0s8-6 12 0" opacity="0.6"/>
          <path d="M7 16c4-3 8 3 12 0s8-5 12 0" opacity="0.45"/>
          <circle cx="20" cy="20" r="2.2" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div><b>Permisos Ambientales</b><span>Expedientes ambientales</span></div>
    </div>
    <nav>
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7"/><rect x="13.5" y="3.5" width="7" height="7"/><rect x="3.5" y="13.5" width="7" height="7"/><rect x="13.5" y="13.5" width="7" height="7"/></svg>
        Panel
      </a>
      <a href="expedientes.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6.5a1.5 1.5 0 0 1 1.5-1.5H10l2 2.5h6.5A1.5 1.5 0 0 1 20 9v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"/></svg>
        Mis expedientes
      </a>
      <a href="expediente-nuevo.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3.5h9l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M12 11v6M9 14h6"/></svg>
        Nuevo expediente
      </a>
      <a href="historial.html" id="nav-historial">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        Historial
      </a>
      <a href="equipo.html" id="nav-equipo" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.8 14.2c2.3.2 4 1.8 4.6 4.8"/></svg>
        Equipo
      </a>
      <a href="consulta-publica.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M19.5 19.5 15 15"/></svg>
        Consulta pública
      </a>
    </nav>
    <div class="rail-foot">© 2026 Permisos Ambientales</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <span class="crumb">MIS EXPEDIENTES</span>
      <div class="who"></div>
    </div>

    <div class="content">
      <div class="content-head">
        <div>
          <h2 id="titulo-lista">Mis expedientes</h2>
          <p class="sub" id="lede-lista"></p>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <a href="/exportar/cartera.xlsx" class="btn btn-ghost" id="btnExportar" download>Exportar Excel</a>
          <a href="expediente-nuevo.html" class="btn btn-brass" id="btnNuevo">+ Nuevo expediente</a>
        </div>
      </div>

      <div class="vista-tabs" role="tablist" aria-label="Vistas de los expedientes" id="tabs-vistas"></div>

      <div class="herramientas" id="herramientas">
        <div class="busqueda">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M19.5 19.5 15 15"/></svg>
          <input type="search" id="buscador" placeholder="Buscar por código, proyecto o cliente" aria-label="Buscar expedientes">
        </div>
        <select id="filtro-estado" aria-label="Estado">
          <option value="">Estado: todos</option>
          <option value="pendiente">Pendiente de subsanación</option>
          <option value="aprobado_interno" id="opt-aprobado-interno">Aprobado internamente</option>
          <option value="evaluacion">En evaluación</option>
          <option value="aprobado">Aprobado</option>
          <option value="rechazado">Rechazado</option>
        </select>
        <select id="filtro-categoria" aria-label="Categoría">
          <option value="">Categoría: todas</option>
          <option value="I">Categoría I</option>
          <option value="II">Categoría II</option>
          <option value="III">Categoría III</option>
        </select>
        <select id="filtro-responsable" aria-label="Responsable" hidden></select>
        <span id="control-agrupar" class="etiqueta-sel">
          <select id="grupo" aria-label="Agrupar por">
            <option value="">Agrupar: estado</option>
            <option value="responsable" class="solo-interno">Agrupar: responsable</option>
            <option value="categoria">Agrupar: categoría</option>
            <option value="ninguno">Sin agrupar</option>
          </select>
        </span>
        <select id="orden" aria-label="Ordenar" class="solo-interno">
          <option value="">Orden: recientes</option>
          <option value="plazo">Orden: por plazo</option>
          <option value="ipe">Orden: por IPE</option>
        </select>
        <details id="menu-columnas" class="menu-columnas" hidden>
          <summary class="btn btn-ghost">Columnas</summary>
          <div class="menu-columnas-lista" id="lista-columnas"></div>
        </details>
        <span class="separador"></span>
        <button type="button" class="btn btn-ghost" id="btn-guardar-vista" title="Guarda la vista actual para abrirla con un clic desde el menú">Guardar vista</button>
      </div>
      <div class="vistas" id="vistas" aria-label="Vistas guardadas" hidden></div>

      <div id="area-vista" aria-live="polite"></div>
      <p class="panel-note" id="pie-lista" style="margin-top:12px;"></p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/pag-expedientes.js"></script>
</body>
</html>
