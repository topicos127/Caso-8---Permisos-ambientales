<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro — Permisos Ambientales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<svg class="topo-bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#16213e" stroke-width="1">
    <path d="M-50 120 C 250 60, 450 180, 700 110 S 1150 60, 1650 140" opacity="0.05"/>
    <path d="M-50 220 C 300 170, 500 280, 780 210 S 1200 160, 1650 250" opacity="0.06"/>
    <path d="M-50 330 C 260 260, 520 380, 800 310 S 1250 270, 1650 360" opacity="0.05"/>
    <path d="M-50 470 C 280 410, 560 520, 830 450 S 1280 400, 1650 500" opacity="0.06"/>
    <path d="M-50 600 C 300 540, 540 650, 820 580 S 1220 540, 1650 630" opacity="0.05"/>
    <path d="M-50 740 C 260 680, 520 800, 810 720 S 1260 680, 1650 770" opacity="0.06"/>
    <path d="M-50 850 C 300 800, 560 900, 840 830 S 1260 790, 1650 870" opacity="0.05"/>
  </g>
</svg>

<div class="doc-screen">
  <div class="doc-sheet" style="max-width:620px;">
    <div class="doc-letterhead">
      <div class="id">
        <div class="seal">
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.1">
            <circle cx="20" cy="20" r="17"/>
            <path d="M6 24c4-4 8 4 12 0s8-6 12 0" opacity="0.6"/>
            <path d="M7 16c4-3 8 3 12 0s8-5 12 0" opacity="0.45"/>
            <circle cx="20" cy="20" r="2.2" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div>
          <b>Permisos Ambientales</b>
          <span>Expediente digital · MiAmbiente</span>
        </div>
      </div>
      <div class="ref">REF. SP&#8209;A8<br>ALTA DE USUARIO</div>
    </div>

    <div class="doc-body">
      <h1>Registro de usuario</h1>
      <p class="doc-lede">Crea tu perfil como consultor ambiental o empresa promotora para empezar a gestionar expedientes.</p>

      <form id="formRegistro">
        <div class="doc-field">
          <label for="tipo">Tipo de usuario</label>
          <select id="tipo">
            <option value="consultor">Consultor ambiental</option>
            <option value="promotor">Promotor / Empresa</option>
          </select>
        </div>
        <div class="doc-field">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
        </div>
        <div class="doc-field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="correo@ejemplo.com" required>
        </div>
        <div class="doc-field-row">
          <div class="doc-field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
          </div>
          <div class="doc-field">
            <label for="password2">Repetir contraseña</label>
            <input type="password" id="password2" placeholder="Repite la contraseña" required>
          </div>
        </div>

        <button type="submit" class="btn-stamp">Registrarme</button>
      </form>

      <div id="mensaje" class="doc-msg"></div>

      <div class="doc-footnote">
        <span>El registro es un prototipo de maquetación</span>
        <span>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></span>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById('formRegistro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const m = document.getElementById('mensaje');
  const nombre = document.getElementById('nombre').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  const rol = document.getElementById('tipo').value;

  if (password !== password2) {
    m.className = 'doc-msg show error';
    m.textContent = 'Las contraseñas no coinciden.';
    return;
  }

  try {
    const r = await fetch('/registro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, email, password, rol })
    });
    const d = await r.json();
    m.className = 'doc-msg show ' + (d.ok ? 'ok' : 'error');
    m.textContent = d.mensaje;
    if (d.ok) setTimeout(() => window.location.href = 'index.html', 1400);
  } catch {
    m.className = 'doc-msg show error';
    m.textContent = 'No se pudo conectar con el servidor.';
  }
});
</script>
</body>
</html>
